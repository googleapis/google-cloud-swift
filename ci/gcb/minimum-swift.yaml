# Google Cloud Build configuration for complex builds.
#
# This configuration delegates most of the steps in the build to a shell script.
# The name of the script is configurable via a substitution. Likewise, the
# machine type is configurable, as some builds need more memory.
options:
  dynamic_substitutions: true
  substitutionOption: 'ALLOW_LOOSE'
  logging: CLOUD_LOGGING_ONLY
  env:
    - GOOGLE_CLOUD_SWIFT_TEST_RUNNING_ON_GCB=1
    - PROJECT_ID=${PROJECT_ID}
    - GCB_TRIGGER_NAME=${TRIGGER_NAME}
  workerPool: 'projects/${PROJECT_ID}/locations/${_POOL_REGION}/workerPools/${_POOL_ID}'
serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/integration-test-runner@${PROJECT_ID}.iam.gserviceaccount.com'
steps:
  - name: 'swift:${_SWIFT_VERSION}-bookworm'
    args: ['ci/gcb/scripts/${_SCRIPT}.sh']
substitutions:
  _POOL_REGION: us-central1
  _POOL_ID: swift-sdk-pool
  _SWIFT_VERSION: '6.2'
