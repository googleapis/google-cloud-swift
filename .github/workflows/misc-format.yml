name: Swift Format
permissions: read-all # zizmor: ignore[excessive-permissions]
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  format:
    name: Verify non-Swift Formatting
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      # Version of librarian is pulled from librarian.yaml,
      # action is pinned to commit SHA to satisfy blanket security policy.
      - uses: googleapis/librarian@c54791693e09a76a7403f3dc81c7c97782908b3d # v0.53.0
      - name: 'Format YAML files'
        run: |
          #!/usr/bin/env bash
          set -euv
          # Make three attempts to avoid download flakes.
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0 || \
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0 || \
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
          git ls-files -z -- '*.yaml' '*.yml' ':!:librarian.yaml' ':!:**/.spi.yml' | \
            xargs -0 yamlfmt
      - name: 'Format librarian.yaml file'
        run: librarian tidy
      - name: Detect drift
        run: git diff --exit-code
