name: Swift Unit Tests
permissions: read-all # zizmor: ignore[excessive-permissions]
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
      - name: Install Swift
        uses: ./.github/actions/install-swift
      - name: Run Tests
        run: ./ci/test.sh
  generated:
    name: Build Generated Code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
      - name: Install Swift
        uses: ./.github/actions/install-swift
      - name: Build Generated Code
        run: ./ci/generated.sh
