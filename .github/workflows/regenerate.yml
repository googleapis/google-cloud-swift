name: Regenerate
permissions: read-all # zizmor: ignore[excessive-permissions]
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  format:
    name: Regenerate GAPIC Libraries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - name: Install Swift
        uses: ./.github/actions/install-swift
      - name: Set up go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6.4
        with:
          go-version: "1.26"
          cache: false
      - name: Set up protoc
        uses: ./.github/actions/install-protoc
      - name: Install Swift Protobuf Plugins
        uses: ./.github/actions/install-protobuf-plugins
      - name: Re-generate
        run: |
          set -e
          # Make three attempts to avoid download flakes.
          go run github.com/googleapis/librarian/cmd/librarian@latest config get version || \
          go run github.com/googleapis/librarian/cmd/librarian@latest config get version || \
          go run github.com/googleapis/librarian/cmd/librarian@latest config get version
          # Now get the version and regenerate the code.
          V=$(go run github.com/googleapis/librarian/cmd/librarian@latest config get version)
          go run github.com/googleapis/librarian/cmd/librarian@${V} version || \
          go run github.com/googleapis/librarian/cmd/librarian@${V} version || \
          go run github.com/googleapis/librarian/cmd/librarian@${V} version
          go run github.com/googleapis/librarian/cmd/librarian@${V} generate --all
      - name: Detect drift
        run: git diff --exit-code
