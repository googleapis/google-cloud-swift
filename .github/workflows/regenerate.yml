name: Regenerate
permissions: read-all # zizmor: ignore[excessive-permissions]
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  format:
    name: Regenerate GAPIC Libraries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: Install Swift
        uses: ./.github/actions/install-swift
      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v6.4
        with:
          go-version: "1.26"
          cache: false
      - name: Re-generate
        run: |
          set -e
          # Make three attempts to avoid download flakes.
          # Normally we recommend `librarian config get version` but that requires
          # downloading two copies of librarian.
          version=$(sed -n 's/^version: *//p' librarian.yaml)
          # Make multiple download attempts to avoid download-induced flakes.
          go install github.com/googleapis/librarian/cmd/librarian@${version} ||
            (sleep 5 && go install github.com/googleapis/librarian/cmd/librarian@${version}) ||
            (sleep 10 && go install github.com/googleapis/librarian/cmd/librarian@${version})
          # Make multiple attempts as installing the tools may require downloads.
          go run github.com/googleapis/librarian/cmd/librarian@${version} -v install ||
            (sleep 5 && go run github.com/googleapis/librarian/cmd/librarian@${version} -v install) ||
            (sleep 10 && go run github.com/googleapis/librarian/cmd/librarian@${version} -v install)
          # Now get the version and regenerate the code.
          V=$(go run github.com/googleapis/librarian/cmd/librarian@latest config get version)
          go run github.com/googleapis/librarian/cmd/librarian@${V} version || \
          go run github.com/googleapis/librarian/cmd/librarian@${V} version || \
          go run github.com/googleapis/librarian/cmd/librarian@${V} version
          go run github.com/googleapis/librarian/cmd/librarian@${V} generate --all
      - name: Detect drift
        run: git diff --exit-code
