name: Regenerate
permissions: read-all # zizmor: ignore[excessive-permissions]
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  format:
    name: Regenerate GAPIC Libraries
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: Install Swift
        uses: ./.github/actions/install-swift
      # Version of librarian is pulled from librarian.yaml,
      # action is pinned to commit SHA to satisfy blanket security policy.
      - uses: googleapis/librarian@c54791693e09a76a7403f3dc81c7c97782908b3d # v0.53.0
      - name: Re-generate
        run: |
          set -e
          # Make multiple attempts as installing the tools may require downloads.
          echo "==== Install tools using librarian ===="
          librarian -v install ||
            (sleep 5 && librarian -v install) ||
            (sleep 10 && librarian -v install)
          # Regenerate the code.
          echo "==== Regenerate all the code using librarian ===="
          librarian generate --all
      - name: Detect drift
        run: git diff --exit-code
